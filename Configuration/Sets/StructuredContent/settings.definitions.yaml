categories:
  structuredContent:
    label: 'Structured Content'
  structuredContent.general:
    label: 'General'
    parent: structuredContent
  structuredContent.defaults:
    label: 'Defaults'
    parent: structuredContent
  structuredContent.jsonLd:
    label: 'JSON-LD'
    parent: structuredContent
  structuredContent.schema:
    label: 'Schema.org'
    parent: structuredContent
  structuredContent.llmsTxt:
    label: 'llms.txt'
    parent: structuredContent

settings:
  structuredContent.enabled:
    label: 'Enable Structured Content'
    description: 'Enable or disable the Structured Content extension for this site'
    type: bool
    default: true
    category: structuredContent.general

  structuredContent.defaults.audience:
    label: 'Default Audience'
    description: 'Default audience for records without explicit context (customer, partner, internal, developer)'
    type: string
    default: 'customer'
    category: structuredContent.defaults

  structuredContent.defaults.tone:
    label: 'Default Tone'
    description: 'Default tone for records without explicit context (informational, promotional, technical, legal)'
    type: string
    default: 'informational'
    category: structuredContent.defaults

  structuredContent.defaults.channels:
    label: 'Default Channels'
    description: 'Comma-separated list of default channels'
    type: string
    default: ''
    category: structuredContent.defaults

  structuredContent.jsonLd.enabled:
    label: 'Enable JSON-LD Enrichment'
    description: 'Enable automatic Schema.org JSON-LD injection into HTML responses'
    type: bool
    default: true
    category: structuredContent.jsonLd

  structuredContent.schema.enabled:
    label: 'Enable Schema.org Enrichment'
    description: 'Enable automatic Schema.org JSON-LD generation'
    type: bool
    default: true
    category: structuredContent.schema

  structuredContent.schema.autoDetect:
    label: 'Auto-detect Schema Type'
    description: 'Automatically detect the appropriate Schema.org type based on content'
    type: bool
    default: true
    category: structuredContent.schema

  structuredContent.schema.priceRange:
    label: 'Price Range (e.g. €€€)'
    description: 'Schema.org priceRange for ProfessionalService'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.areaServed:
    label: 'Area Served (ISO country code)'
    description: 'Geographic area served, used in ProfessionalService and Service schemas'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.openingHours:
    label: 'Opening Hours (Schema.org format)'
    description: 'Opening hours specification, e.g. Mo-Fr 09:00-18:00'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.serviceTypes:
    label: 'Service Types (comma-separated)'
    description: 'Comma-separated list of service types for ProfessionalService schema'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.searchActionUrl:
    label: 'Search Action URL'
    description: 'URL pattern for WebSite SearchAction (e.g. /suche?q={search_term_string}). Leave empty to disable SearchAction.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.legalName:
    label: 'Legal Name'
    description: 'Registered legal name of the organization (e.g. Moselwal Digitalagentur GmbH)'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.defaultAuthorPersonSlug:
    label: 'Default Author (Person Slug)'
    description: 'Slug of the moselwal_person record used as Article/BlogPosting author when a page has no author record. Empty = founderPersonSlug is used. A free-text page author naming somebody else is kept.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.imageLicenseUrl:
    label: 'Image License URL'
    description: 'URL zur Lizenz unter der Hero-Bilder publiziert werden (Schema.org ImageObject.license). Leer = kein license-Property im JSON-LD. Beispiel: https://creativecommons.org/licenses/by-nc-nd/4.0/'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.imageAcquireLicensePage:
    label: 'Image Acquire License Page'
    description: 'URL zur Seite die zeigt, wie das Bild lizenziert werden kann (Schema.org ImageObject.acquireLicensePage). Optional, fuer Google-Image-Lizenz-Markup empfohlen.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.imageCopyrightNotice:
    label: 'Image Copyright Notice'
    description: 'Copyright-Hinweis fuer Hero-Bilder (Schema.org ImageObject.copyrightNotice). Wenn leer, wird automatisch "© <year> <legalName>" generiert.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.organizationDescription:
    label: 'Organization Description'
    description: 'Stable description of the organization (NOT the article description). Used for Schema.org Organization.description and WebSite.description. Must NOT change per page — describes who the company IS, not what an article is about. Per language, override it in the site configuration under languages[].structuredContent.organizationDescription.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.organizationTypes:
    label: 'Additional Organization Types'
    description: 'Comma-separated additional Schema.org types to merge with Organization (e.g. "ProfessionalService" or "LocalBusiness"). Default = none = pure Organization. Only set if you explicitly want the local-business interpretation.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.streetAddress:
    label: 'Street Address'
    description: 'Street and house number for PostalAddress schema'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.postalCode:
    label: 'Postal Code'
    description: 'Postal/ZIP code for PostalAddress schema'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.addressRegion:
    label: 'Address Region'
    description: 'State or region for PostalAddress schema (e.g. NRW)'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.phone:
    label: 'Phone'
    description: 'Phone number for ContactPoint schema (E.164 format recommended, e.g. +49-2173-123456)'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.vatID:
    label: 'VAT ID'
    description: 'VAT identification number (Umsatzsteuer-ID, e.g. DE335028333)'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.addressLocality:
    label: 'Address Locality'
    description: 'City / locality for PostalAddress schema (e.g. "Monheim am Rhein"). Fallback: footerLocation (mit Trim am ersten Komma).'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.addressCountry:
    label: 'Address Country'
    description: 'ISO-3166-1 alpha-2 country code for PostalAddress.addressCountry (e.g. DE, AT, CH).'
    type: string
    default: 'DE'
    category: structuredContent.schema

  structuredContent.schema.email:
    label: 'Organization Email'
    description: 'Public Organization-Email (Schema.org Organization.email). Fallback: footerEmail.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.foundingDate:
    label: 'Founding Date'
    description: 'Year (YYYY) or full ISO-date the organization was founded. Fallback: footerFoundingDate.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.sameAs:
    label: 'Same-As URLs (CSV)'
    description: 'Komma-separierte Liste zusätzlicher sameAs-URLs (Reddit, x.com, Bsky, …) — wird mit den Footer-Social-Keys gemerged und dedupliziert. NIE die eigene Website hier eintragen (dafür ist `url`).'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.knowsAbout:
    label: 'Knows About (CSV)'
    description: 'Komma-separierte Liste von Themen/Technologien, die die Organization beherrscht (Schema.org Organization.knowsAbout). Hilft Knowledge-Graph + LLM-Crawlern, die Org thematisch einzuordnen.'
    type: string
    default: ''
    category: structuredContent.schema

  structuredContent.schema.contactPointTypes:
    label: 'Contact-Point Types (CSV)'
    description: 'Komma-separierte Liste der `ContactPoint.contactType`-Werte (z.B. "sales, technical support"). Jeder Eintrag erzeugt einen ContactPoint mit den Org-Defaults für email/phone/areaServed/availableLanguage. Leer → kein contactPoint-Feld.'
    type: string
    default: 'sales, technical support'
    category: structuredContent.schema

  structuredContent.schemaMapping:
    label: 'CType to Schema Mapping'
    description: 'Custom mapping from TYPO3 CType identifier to Schema.org type. Format: { ctype1: SchemaType1, ctype2: SchemaType2 }'
    type: stringlist
    default: []
    category: structuredContent.schema

  structuredContent.llmsTxt.enabled:
    label: 'Enable llms.txt Auto-Generation'
    description: 'Generate /llms.txt and /llms-full.md automatically from the page tree. Replaces any static route configured for these paths.'
    type: bool
    default: true
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.tagline:
    label: 'Tagline'
    description: 'Short summary blockquote shown directly under the H1 of llms.txt (1–3 sentences, plain text). Per language: taglineEn etc. When empty, the language''s structuredContent.organizationDescription from the site configuration is used, then (for a non-default language) the default tagline, then structuredContent.schema.organizationDescription.'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.contactEmail:
    label: 'Contact Email'
    description: 'Email address shown in the contact section of llms.txt.'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.contactLocation:
    label: 'Contact Location'
    description: 'Geographic location (e.g. "Monheim am Rhein, Deutschland") shown in the contact section of llms.txt.'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.linkedinUrl:
    label: 'LinkedIn URL'
    description: 'Full LinkedIn URL (organisation or personal) shown in the contact section.'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.githubUrl:
    label: 'GitHub URL'
    description: 'Full GitHub organisation/user URL shown in the contact section.'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.fullDumpEnabled:
    label: 'Enable /llms-full.md'
    description: 'Generate a concatenated Markdown dump of all visible pages at /llms-full.md.'
    type: bool
    default: true
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.fullDumpMaxPages:
    label: 'Full Dump: Max Pages'
    description: 'Cap the number of pages included in /llms-full.md to keep the file size sane.'
    type: int
    default: 100
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.intro:
    label: 'Intro Paragraph'
    description: 'Optional Markdown paragraph rendered between the blockquote tagline and the first H2 section. Use this to explain what the site is about in 1–2 short paragraphs (line breaks supported).'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.mainGroupLabel:
    label: 'Main Group Label'
    description: 'Heading for the section that catches all top-level pages without their own hub. Default: "Wichtige Seiten".'
    type: string
    default: 'Wichtige Seiten'
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.optionalParents:
    label: 'Optional Section Parent Page IDs'
    description: 'Comma-separated page UIDs whose subtrees should be rendered under the "## Optional" section instead of their own group. Useful for footer-only hubs, archive pages, or legacy content that LLMs may skip when context is tight.'
    type: stringlist
    default: []
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.featuredLimit:
    label: 'Featured Pages: Max Pages'
    description: 'Maximum number of pages in the featured section at the top of llms.txt. Editors pick the pages with the page field "Feature in llms.txt" (tx_structuredcontent_llms_featured); they are listed in page-tree order. 0 or less falls back to the default. No flagged page = no featured section.'
    type: int
    default: 15
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.featuredGroupLabel:
    label: 'Featured Group Label'
    description: 'Heading of the featured section. Per language: featuredGroupLabelEn etc. Empty = "Empfohlene Seiten" / "Featured Pages".'
    type: string
    default: ''
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.postListLimit:
    label: 'Post List Limit per Section'
    description: 'A hub section with more pages than this lists only the newest posts (by creation date), followed by its archive/index pages (pages with subpages inside the hub, e.g. per-year pages) or, if it has none, a link to the hub page itself. 0 = no limit.'
    type: int
    default: 30
    category: structuredContent.llmsTxt

  structuredContent.llmsTxt.archiveLinkLabel:
    label: 'Archive Link Label'
    description: 'Link text of the hub link that replaces the cut posts when a capped section has no archive/index pages. Per language: archiveLinkLabelEn etc. Empty = "Alle Beiträge" / "All posts".'
    type: string
    default: ''
    category: structuredContent.llmsTxt
